<title>Lilypad Reach</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Philosopher:wght@700&family=Karla:wght@400;600&display=swap">
<style>
/* Layout: full-bleed game canvas, a single brass-and-verdigris control strip along the bottom */
:root{color-scheme:dark;--deep:#0b2a33;--ver:#7fb489;--paper:#efe7d2;--amber:#d98a3a;--ink:#071a20;--disp:"Philosopher",Georgia,serif;--body:"Karla",system-ui,sans-serif}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--deep);color:var(--paper);overflow:hidden;font-family:var(--body)}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;outline:0}
#under{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 20%,rgba(30,120,120,.25),rgba(4,40,55,.7));pointer-events:none}
#load{position:fixed;inset:0;display:grid;place-content:center;gap:12px;background:var(--deep);text-align:center;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
#load h1{font:700 clamp(34px,7vw,60px)/1 var(--disp);margin:0;color:var(--ver)}
#load p{margin:0;opacity:.8}.track{height:3px;background:#ffffff22;width:min(320px,70vw);margin:auto}#bar{height:100%;width:0;background:var(--amber)}
#hud{position:fixed;left:0;right:0;bottom:0;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
#forms{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;pointer-events:auto}
#forms button{font:600 14px var(--body);color:var(--paper);background:rgba(7,26,32,.66);border:1px solid #7fb48955;border-radius:4px;padding:7px 11px;display:flex;gap:7px;align-items:center;cursor:pointer}
#forms button.on{background:var(--ver);color:var(--ink);border-color:var(--ver)}
#forms button:focus-visible{outline:2px solid var(--amber)}
kbd{font:600 12px var(--body);border:1px solid currentColor;border-radius:3px;padding:0 5px}
#tip{font-size:13px;background:rgba(7,26,32,.55);padding:5px 10px;border-radius:4px;text-align:center;transition:opacity 1s}#tip.dim{opacity:.55}
#fade{position:fixed;inset:0;background:#040c10;opacity:0;pointer-events:none;transition:opacity .22s}#fade.on{opacity:1}
#prompt{position:fixed;left:50%;top:62%;transform:translateX(-50%);font:600 16px var(--body);background:rgba(7,26,32,.82);border:1px solid var(--amber);border-radius:4px;padding:8px 14px;max-width:calc(100vw - 32px);white-space:nowrap}
#nightBtn{font:600 14px var(--body);color:var(--paper);background:rgba(7,26,32,.66);border:1px solid #d98a3a88;border-radius:4px;padding:7px 11px;display:flex;gap:7px;align-items:center;cursor:pointer}
</style>
<canvas id="c" tabindex="0" aria-label="Lilypad Reach game view"></canvas>
<div id="under" hidden></div>
<div id="fade"></div><div id="prompt" hidden><kbd>E</kbd> Enter</div>
<div id="hud"><div id="forms"><button type="button" id="nightBtn"><kbd>N</kbd>Day</button></div>
<div id="tip">Click to look around · WASD move · Space jump (hold to squish and leap further) · Shift sprint · C dive · 1–5 change form · E use door · N day/night · R restart</div></div>
<div id="load"><h1>Lilypad Reach</h1><p>Filling the sea…</p><div class="track"><div id="bar"></div></div></div>

// Utilities
uvec4 uTexelFetch1D( usampler2D tex, uint index ) {

	uint width = uint( textureSize( tex, 0 ).x );
	uvec2 uv;
	uv.x = index % width;
	uv.y = index / width;

	return texelFetch( tex, ivec2( uv ), 0 );

}

ivec4 iTexelFetch1D( isampler2D tex, uint index ) {

	uint width = uint( textureSize( tex, 0 ).x );
	uvec2 uv;
	uv.x = index % width;
	uv.y = index / width;

	return texelFetch( tex, ivec2( uv ), 0 );

}

vec4 texelFetch1D( sampler2D tex, uint index ) {

	uint width = uint( textureSize( tex, 0 ).x );
	uvec2 uv;
	uv.x = index % width;
	uv.y = index / width;

	return texelFetch( tex, ivec2( uv ), 0 );

vec4 textureSampleBarycoord( sampler2D tex, vec3 barycoord, uvec3 faceIndices ) {

	return

		barycoord.y * texelFetch1D( tex, faceIndices.y ) +
		barycoord.z * texelFetch1D( tex, faceIndices.z );

}

void ndcToCameraRay(
	vec2 coord, mat4 cameraWorld, mat4 invProjectionMatrix,
	out vec3 rayOrigin, out vec3 rayDirection
) {

	// get camera look direction and near plane for camera clipping
	vec4 lookDirection = cameraWorld * vec4( 0.0, 0.0, - 1.0, 0.0 );
	vec4 nearVector = invProjectionMatrix * vec4( 0.0, 0.0, - 1.0, 1.0 );
	float near = abs( nearVector.z / nearVector.w );

	// get the camera direction and position from camera matrices
	vec4 origin = cameraWorld * vec4( 0.0, 0.0, 0.0, 1.0 );
	vec4 direction = invProjectionMatrix * vec4( coord, 0.5, 1.0 );
	direction /= direction.w;
	direction = cameraWorld * direction - origin;

	// slide the origin along the ray until it sits at the near clip plane position
	origin.xyz += direction.xyz * near / dot( direction, lookDirection );

	rayOrigin = origin.xyz;
	rayDirection = direction.xyz;

}

// Raycasting
bool intersectsBounds( vec3 rayOrigin, vec3 rayDirection, vec3 boundsMin, vec3 boundsMax, out float dist ) {

	// https://www.reddit.com/r/opengl/comments/8ntzz5/fast_glsl_ray_box_intersection/
	// https://tavianator.com/2011/ray_box.html
	vec3 invDir = 1.0 / rayDirection;

	// find intersection distances for each plane
	vec3 tMinPlane = invDir * ( boundsMin - rayOrigin );
	vec3 tMaxPlane = invDir * ( boundsMax - rayOrigin );

	// get the min and max distances from each intersection
	vec3 tMinHit = min( tMaxPlane, tMinPlane );
	vec3 tMaxHit = max( tMaxPlane, tMinPlane );

	// get the furthest hit distance
	vec2 t = max( tMinHit.xx, tMinHit.yz );
	float t0 = max( t.x, t.y );

	// get the minimum hit distance
	t = min( tMaxHit.xx, tMaxHit.yz );
	float t1 = min( t.x, t.y );

	// set distance to 0.0 if the ray starts inside the box
	dist = max( t0, 0.0 );

	return t1 >= dist;

}

	uvt += vec4( TRI_INTERSECT_EPSILON );

bool intersectTriangles(
	// geometry info and triangle range
	sampler2D positionAttr, usampler2D indexAttr, uint offset, uint count,

	// ray
	vec3 rayOrigin, vec3 rayDirection,

	// outputs
	inout float minDistance, inout uvec4 faceIndices, inout vec3 faceNormal, inout vec3 barycoord,
	inout float side, inout float dist
) {

	bool found = false;
	vec3 localBarycoord, localNormal;
	float localDist, localSide;
	for ( uint i = offset, l = offset + count; i < l; i ++ ) {

		uvec3 indices = uTexelFetch1D( indexAttr, i ).xyz;
		vec3 a = texelFetch1D( positionAttr, indices.x ).rgb;
		vec3 b = texelFetch1D( positionAttr, indices.y ).rgb;
		vec3 c = texelFetch1D( positionAttr, indices.z ).rgb;

		if (
			intersectsTriangle( rayOrigin, rayDirection, a, b, c, localBarycoord, localNormal, localDist, localSide )
			&& localDist < minDistance
		) {

			found = true;
			minDistance = localDist;

			faceIndices = uvec4( indices.xyz, i );
			faceNormal = localNormal;

			side = localSide;
			barycoord = localBarycoord;
			dist = localDist;

		}

	}

	return found;

}

bool intersectsBVHNodeBounds( vec3 rayOrigin, vec3 rayDirection, sampler2D bvhBounds, uint currNodeIndex, out float dist ) {

	uint cni2 = currNodeIndex * 2u;
	vec3 boundsMin = texelFetch1D( bvhBounds, cni2 ).xyz;
	vec3 boundsMax = texelFetch1D( bvhBounds, cni2 + 1u ).xyz;
	return intersectsBounds( rayOrigin, rayDirection, boundsMin, boundsMax, dist );

}

	// ray
	vec3 rayOrigin, vec3 rayDirection,

	// output variables split into separate variables due to output precision
	inout uvec4 faceIndices, inout vec3 faceNormal, inout vec3 barycoord,
	inout float side, inout float dist
) {

	// stack needs to be twice as long as the deepest tree we expect because
	// we push both the left and right child onto the stack every traversal
	int ptr = 0;
	uint stack[ BVH_STACK_DEPTH ];
	stack[ 0 ] = 0u;

	float triangleDistance = INFINITY;
	bool found = false;
	while ( ptr > - 1 && ptr < BVH_STACK_DEPTH ) {

		uint currNodeIndex = stack[ ptr ];
		ptr --;

		// check if we intersect the current bounds
		float boundsHitDistance;
		if (
			! intersectsBVHNodeBounds( rayOrigin, rayDirection, bvh_bvhBounds, currNodeIndex, boundsHitDistance )
			|| boundsHitDistance > triangleDistance

			continue;

		}

		bool isLeaf = bool( boundsInfo.x & 0xffff0000u );

		if ( isLeaf ) {

			uint count = boundsInfo.x & 0x0000ffffu;
			uint offset = boundsInfo.y;

			found = intersectTriangles(
				bvh_position, bvh_index, offset, count,
				rayOrigin, rayDirection, triangleDistance,
				faceIndices, faceNormal, barycoord, side, dist
			) || found;

		} else {

			uint leftIndex = currNodeIndex + 1u;
			uint splitAxis = boundsInfo.x & 0x0000ffffu;
			uint rightIndex = boundsInfo.y;

			bool leftToRight = rayDirection[ splitAxis ] >= 0.0;
			uint c1 = leftToRight ? leftIndex : rightIndex;
			uint c2 = leftToRight ? rightIndex : leftIndex;

			// set c2 in the stack so we traverse it later. We need to keep track of a pointer in
			// the stack while we traverse. The second pointer added is the one that will be
			// traversed first
			ptr ++;
			stack[ ptr ] = c2;

			ptr ++;
			stack[ ptr ] = c1;

		}

	}

	return found;
